name: Build native library of libmttslangc for Windows arm64

on:
  push:
    tags:
      - "mttslangc-natives-all-*"
      - "mttslangc-natives-windowsarm64-*"

jobs:
  build:
    name: Build native library of libmttslangc for Windows arm64
    permissions:
      contents: write
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: mechtatel-natives/natives/lib-mttslangc
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Init and update submodules
        run: git submodule update --init
      - name: Download Slang release
        run: |
          mkdir Download; cd Download
          Invoke-WebRequest `
            https://github.com/shader-slang/slang/releases/download/v2026.13/slang-2026.13-windows-aarch64.tar.gz `
            -OutFile slang-2026.13-windows-aarch64.tar.gz
          tar -xf slang-2026.13-windows-aarch64.tar.gz
      - name: Copy slang.dll and slang.lib to lib directory
        run: |
          mkdir lib
          cp ./Download/bin/slang.dll ./lib/
          cp ./Download/lib/slang.lib ./lib/
      - name: Build libmttslangc
        run: |
          mkdir build; cd build
          cmake ..
          cmake --build . --config Release
      - name: Rename the build artifact to prevent name collision
        run: |
          cd build/Release
          mv mttslangc.dll mttslangc-arm64.dll
      - name: Publish build artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: mechtatel-natives/natives/lib-mttslangc/build/Release/mttslangc-arm64.dll
